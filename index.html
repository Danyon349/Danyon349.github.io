<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproduzir Áudio</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            color: #fff;
            background-color: #ff2f00;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active {
            background-color: #ff2f00;
        }
    </style>
</head>
<body>

    <button onclick="tocarAudio()">Ouvir Áudio</button>

    <script>
        const audio = new Audio('Est ce que tu m aimes.mp3'); // Substitua pelo nome do seu arquivo de áudio

        function tocarAudio() {
            audio.play();
        }
    </script>

</body>
</html>
